name: Salesforce CI Pipeline

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop

jobs:
  salesforce-validation:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Install Salesforce CLI (Official)
      - name: Setup Salesforce CLI
        uses: salesforcecli/github-action@v2

      # Verify CLI
      - name: Verify Salesforce CLI
        run: |
          sf version

      # Create JWT Key File
      - name: Create JWT Key File
        shell: bash
        run: |
          cat > server.key << 'EOF'
          ${{ secrets.SF_JWT_KEY }}
          EOF

      # Verify key file
      - name: Verify Key File
        run: |
          ls -l server.key
          head -1 server.key
          tail -1 server.key

      # Authenticate to Salesforce
      - name: Authenticate Salesforce
        run: |
          sf org login jwt \
            --client-id "${{ secrets.SF_CLIENT_ID }}" \
            --jwt-key-file server.key \
            --username "${{ secrets.SF_USERNAME }}" \
            --instance-url "${{ secrets.SF_INSTANCE_URL }}"

      # Display authenticated org
      - name: Display Org
        run: |
          sf org display

      # Display project files
      - name: Display Repository Files
        run: |
          ls -la